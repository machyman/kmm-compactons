[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kmm-compactons"
version = "1.0.0"
description = "Computational tools for K(m,m) compacton equations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "James M. Hyman", email = "mhyman@tulane.edu"},
]
keywords = ["compactons", "nonlinear waves", "PDE", "K(m,n)", "conservation laws"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
symbolic = ["sympy>=1.12"]
all = ["kmm-compactons[dev,symbolic]", "jupyter>=1.0"]

[project.urls]
Homepage = "https://github.com/machyman/kmm-compactons"
Repository = "https://github.com/machyman/kmm-compactons"
Issues = "https://github.com/machyman/kmm-compactons/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
